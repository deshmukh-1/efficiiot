# Cloudflare Pages + Functions + D1
# 1) Create DB:     npx wrangler d1 create efficiiot-enquiries
# 2) Copy database_id from output into [[d1_databases]] below (replace REPLACE_ME).
# 3) Apply schema: npx wrangler d1 execute efficiiot-enquiries --remote --file=./d1/schema.sql
# 4) In Cloudflare Dashboard → Pages → your project → Settings → Functions:
#    confirm D1 binding "DB" is attached (Git deploy usually reads this file).
# 5) Set env var DISCORD_WEBHOOK_URL as before.

name = "efficiiot"
compatibility_date = "2025-05-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "efficiiot-enquiries"
database_id = "REPLACE_ME"
